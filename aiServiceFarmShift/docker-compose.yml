services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=true
      - AI_INTERNAL_TOKEN=${AI_INTERNAL_TOKEN:-farmshift-local-ai-token}
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - .:/app
      - /app/venv
      - /app/.venv
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-exclude "venv/*"
      --reload-exclude ".venv/*"
      --reload-exclude "__pycache__/*"
      --reload-exclude "*.pyc"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
