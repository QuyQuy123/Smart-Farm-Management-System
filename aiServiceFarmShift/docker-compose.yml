services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=true
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - .:/app
      - /app/venv
      - /app/.venv
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-exclude "venv/*"
      --reload-exclude ".venv/*"
      --reload-exclude "__pycache__/*"
      --reload-exclude "*.pyc"
    restart: unless-stopped
