worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Chong Slowloris / nghen socket keo dai
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 1000;
    send_timeout 10s;
    client_max_body_size 15m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Rate limiting & connection limiting theo IP nguon
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=80r/s;
    limit_req_zone $binary_remote_addr zone=asset_limit:10m rate=300r/s;
    limit_conn_zone $binary_remote_addr zone=conn_auth:10m;
    limit_conn_zone $binary_remote_addr zone=conn_api:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Micro-cache 2 giay cho SPA HTML routes (/dashboard, /account, ...)
    proxy_cache_path /var/cache/nginx/spa levels=1:2 keys_zone=spa_cache:10m max_size=64m inactive=15s use_temp_path=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    upstream frontend_vite {
        server frontend:5173;
        keepalive 64;
    }

    upstream backend_api {
        server backend:8080;
        keepalive 64;
    }

    server {
        listen 5173;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # 1. Auth endpoints (chong flood BCrypt & brute-force)
        location ^~ /api/auth/ {
            limit_conn conn_auth 30;
            limit_req zone=auth_limit burst=20 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # 2. Backend API & SSE
        location ^~ /api/ {
            limit_conn conn_api 80;
            limit_req zone=api_limit burst=150 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 65s;
        }

        # 3. Vite dev assets, HMR client, source JSX/CSS, static files (KHONG cache de hot-reload tuc thi)
        location ~* ^/(@|src/|node_modules/|assets/|img/|weigh-slips/|phieu_can/|samples/)|\.[^/]+$ {
            limit_req zone=asset_limit burst=500 nodelay;

            proxy_pass http://frontend_vite;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # 4. SPA routes (/dashboard, /account, /) + Vite HMR WebSocket root
        # Micro-cache 2s trong RAM Nginx chong flood 500+ conn vao Vite dev server ma Web van muot
        location / {
            proxy_pass http://frontend_vite;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;

            proxy_cache spa_cache;
            proxy_cache_key "$scheme$request_method$uri";
            proxy_ignore_headers Cache-Control Expires;
            proxy_cache_valid 200 2s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_bypass $http_upgrade;
            proxy_no_cache $http_upgrade;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
