/* FarmGo diary layouts and system map */
.prototype-strip{display:none}
.farm-diary{font-size:12px;color:#15344f}
.farm-diary-cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:30px;margin-bottom:20px}
.farm-diary-cards .quick-card{min-height:67px;padding:15px 18px;box-shadow:0 2px 3px #233b5710}
.farm-diary-cards .quick-card strong{color:var(--diary-color);font-size:14px}
.farm-diary-cards .quick-card.selected{border-color:color-mix(in srgb,var(--diary-color) 45%,white)}
.journal-toolbar{background:var(--diary-color);border-radius:5px;min-height:54px;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:white;margin-bottom:20px;font-size:16px}
.journal-toolbar>input{height:32px;width:210px;font-size:12px;border:1px solid #ccd4dd;padding:7px 12px;border-radius:3px}
.journal-toolbar-actions{display:flex;align-items:center;gap:7px}
.journal-excel{height:32px;background:white;border:1px solid #ccd4dd;font-size:11px;padding:6px 12px;color:#34566c}
.journal-excel .icon{color:#159451;width:14px;height:14px}
.journal-date{display:flex;height:32px;background:white;color:#456481;border-radius:3px;overflow:hidden;border:1px solid #d0d7de;align-items:center}
.journal-date>button{height:31px;width:31px;border:0;background:white;color:#37516b;font-size:25px;line-height:20px;border-right:1px solid #e8edf1}
.journal-date>button:last-child{border-left:1px solid #e8edf1;border-right:0}
.journal-date>button:hover{background:#eaf4f3}
.journal-date label{display:flex;align-items:center;padding:0 6px;gap:5px}
.journal-date label{position:relative;min-width:154px;height:31px}
.journal-date-text{font-size:12px;line-height:30px;padding:0 3px}
.journal-date .journal-date-native{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0}
.journal-date-native::-webkit-calendar-picker-indicator{width:100%;height:100%;position:absolute;inset:0;margin:0;cursor:pointer}
.journal-date label>.icon{width:15px;height:15px;color:#73879b}
.journal-date input{border:0;width:135px;height:30px;padding:3px 2px;font-size:12px;background:white;color:#456481}
.journal-area{border:1px solid #e0e5ec;border-radius:3px;background:white;box-shadow:0 2px 3px #243b5510;margin-bottom:22px;overflow:visible}
.journal-area-head{display:flex;justify-content:space-between;align-items:center;padding:15px 19px;min-height:62px;gap:15px}
.journal-area-head h3{margin:0;font-size:16px;font-weight:400;line-height:1.5}
.journal-area-head .btn-group{gap:8px;align-items:center}
.journal-area-head .primary{background:#7dcac2;border-color:#7dcac2;font-size:12px;padding:5px 11px;height:29px;min-height:29px}
.journal-area-head .row-menu-button{font-size:20px;height:27px;min-width:20px;padding:0 4px;color:#75869b}
.journal-area-head .disabled{opacity:.45;pointer-events:none}
.journal-outline{border:1px solid #00b3b7;color:#00a9ad;background:white;font-size:12px;min-height:29px;padding:4px 8px}
.journal-outline .icon{width:12px;height:12px}
.journal-table-scroll{overflow-x:auto;border-top:1px solid #e1e6ec;border-radius:0 0 3px 3px}
.journal-table{width:100%;border-collapse:collapse;text-align:left;color:#15344f;font-size:12px}
.journal-table th,.journal-table td{border-bottom:1px solid #e1e6ec;border-right:1px solid #e1e6ec;padding:13px 10px;vertical-align:middle}
.journal-table th:last-child,.journal-table td:last-child{border-right:0}
.journal-table tbody tr:last-child td{border-bottom:0}
.journal-table th{font-weight:400;color:#164874;background:#f3f6fa;height:49px;white-space:nowrap}
.journal-table tr:nth-child(odd) td{background:#fbfcfd}
.journal-table tr:hover td{background:#f7fafb}
.journal-table input,.journal-table select{width:100%;min-width:80px;height:32px;background:white;border:1px solid #dce3eb;border-radius:3px;padding:6px 10px;color:#53657a;font-size:12px;line-height:1.5}
.journal-table input:focus,.journal-table select:focus{border-color:#78c6bc;outline:2px solid #bce7df55}
.journal-table input:disabled,.journal-table select:disabled{background:#f4f6f8;color:#98a6b1;opacity:1}
.journal-house-col{width:170px;min-width:150px}
.journal-house strong,.journal-sum strong{display:block;font-size:13px;color:#123853;text-transform:uppercase}
.journal-house small,.journal-sum small{display:block;font-size:10px;line-height:1.65;color:#58718b}
.journal-total-col{width:135px;min-width:125px;text-align:center}
.journal-total{text-align:center;font-weight:400;color:#165188}
.feed-matrix{min-width:760px}
.feed-matrix td{height:56px}
.feed-matrix th:not(.journal-house-col):not(.journal-total-col){min-width:150px}
.feed-session-title{display:flex;align-items:center;justify-content:space-between;gap:10px;text-transform:uppercase}
.journal-delete{font-size:10px;color:#ff5c68;border:1px solid #ff5c68;background:transparent;padding:2px 5px;min-height:23px;border-radius:2px;gap:2px;line-height:1.3}
.journal-delete .icon{width:11px;height:11px}
.feed-cell{position:relative;padding-right:33px!important}
.feed-cell>strong{font-size:12px;color:#173b5c}
.feed-cell-plus{position:absolute;top:7px;right:6px;border:1px solid #cbd3da;border-radius:2px;background:#f8fafb;color:#728493;font-size:18px;width:22px;height:22px;line-height:17px;padding:0;opacity:0}
.feed-cell:hover .feed-cell-plus,.feed-cell:focus-within .feed-cell-plus{opacity:1}
.feed-cell-entry{font-size:10px;margin-top:4px;max-width:280px}
.feed-cell-entry button{text-align:left;line-height:1.5}
.journal-text-link{border:0;background:none;padding:0;color:#527a9e;font-size:inherit;text-align:left;text-decoration:none}
.journal-text-link:hover{text-decoration:underline;color:#00998d}
.journal-sum td{background:#fff!important;font-weight:bold;height:54px}
.journal-sum .journal-total{font-weight:400}

function startEditor(kind,id=''){const source=id?(kind==='purchase'?S.purchases:S.sales).find(x=>x.id===id):null;editor=source?{...JSON.parse(JSON.stringify(source)),kind,editing:true}:{kind,party:(kind==='purchase'?S.suppliers[0]?.id:S.customers[0]?.id)||'',date:TODAY,lines:[],discount:0,extra:0,paid:0,reference:'',notes:'',fund:'F001',method:'Tiền mặt',house:modalContext.harvestHouse||'',flock:'',count:0,avgWeight:0,harvestType:'TH002',confirmStock:false};}

ức thanh toán',e.method||'Tiền mặt','select',['Tiền mặt','Chuyển khoản'],'data-editor="method"')}${field('fund','Quỹ tiền',e.fund||'F001','select',S.funds.filter(f=>f.active).map(f=>[f.id,f.name]),'data-editor="fund"')}</div><p class="small">Tính vào công nợ: <strong id="editor-debt">${money(Math.max(0,editorTotal(e)-Number(e.paid||0)))}</strong></p></div>${panel(purchase?'Nhập kho':harvest?'Xuất bán':'Xuất kho',`<label class="check"><input type="checkbox" id="editor-confirm-stock" data-editor="confirmStock" ${e.confirmStock?'checked':''}>Xác nhận ${purchase?'đã nhận hàng':harvest?'đã thu hoạch và xuất bán':'đã xuất kho'}</label><div class="muted small gap">Có thể lưu đơn trước và xác nhận ${purchase?'nhập kho':'xuất hàng'} ở màn chi tiết.</div>`)}${panel('Tệp đính kèm',`<input type="file" multiple name="invoiceFiles" id="invoice-files" accept="image/*,.pdf"><p class="muted small">Ảnh hóa đơn, phiếu cân hoặc chứng từ giao nhận.</p>`,purchase?btn('Đọc ảnh hóa đơn','open:ocr','','file'):'')}</div></div>`;}
function editorTotal(e){return Math.max(0,sum(e.lines,l=>l.qty*l.price*(1+(Number(l.vat)||0)/100))-(Number(e.discount)||0)+(Number(e.extra)||0));}
function invoiceLinesTable(e,detail=false){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Danh mục kho</th><th>Tên hàng hóa</th>${e.kind==='harvest'?'<th>Số con</th>':''}<th>Số lượng</th><th>Đơn vị</th><th>Đơn giá</th><th>VAT</th><th>Thành tiền</th>${!detail?'<th></th>':''}</tr></thead><tbody>${e.lines.length?e.lines.map((l,i)=>{const it=itemBy(l.item);return `<tr><td>${categoryName(it?.category||'')}</td><td>${esc(it?.name||l.item)}</td>${e.kind==='harvest'?`<td>${num(l.count||0)}</td>`:''}<td>${num(l.qty)}</td><td>${esc(l.unit||it?.unit)}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price*(Number(l.vat)||0)/100)}</td><td>${money(l.qty*l.price*(1+(Number(l.vat)||0)/100))}</td>${!detail?`<td><button class="btn danger small" data-action="remove-line:${i}">Xóa</button></td>`:''}</tr>`}).join(''):`<tr><td colspan="9"><div class="note">Hóa đơn hiện đang không có hàng hóa.</div></td></tr>`}</tbody></table></div>`;}

function invoiceDetailPage(){const purchase=route==='purchase-detail',p=(purchase?S.purchases:S.sales).find(x=>x.id===entity);if(!p)return panel('',empty('Không tìm thấy đơn'));const received=purchase?p.received:p.shipped,paid=p.paid>=p.total;return `<div class="workflow-steps"><div class="workflow-step done"><b>1</b>Đã lưu đơn</div><div class="workflow-step ${received?'done':''}"><b>2</b>${purchase?'Nhập kho':'Xuất hàng'} ${received?'hoàn tất':'chưa hoàn tất'}</div><div class="workflow-step ${paid?'done':''}"><b>3</b>Thanh toán ${paid?'hoàn tất':'còn nợ'}</div></div>${panel('',`<div class="panel-head"><div class="invoice-title">Hóa đơn <strong>#${p.id}</strong> ngày <strong>${date(p.date)}</strong></div><div class="btn-group">${btn('Hủy hóa đơn','open:cancel-invoice:'+p.id,'danger','trash')}${btn('Sửa hóa đơn','edit-invoice:'+p.id,'light','edit')}${btn('In phiếu','print','','print')}</div></div><p class="small">${purchase?'Nhà cung cấp':'Khách hàng'}: <strong>${esc(partyName(p.party))}</strong></p>${p.kind==='harvest'?`<p class="small">Nguồn thu hoạch: <strong>${houseName(p.house)} · ${p.flock||'—'}</strong></p>`:''}${invoiceLinesTable({...p,kind:purchase?'purchase':p.kind},true)}<div class="summary-box gap">${invoiceTotals(p)}</div>`)}${panel('Kho hàng',`<div class="form-grid three">${field('stockDate',purchase?'Ngày nhập kho':'Ngày xuất hàng',purchase?p.receivedDate||TODAY:p.shippedDate||TODAY,'date',null,received?'readonly':'')}${field('stockWorker','Nhân viên kho',p.stockWorker||'NV001','select',S.employees.map(e=>[e.id,e.name]),received?'disabled':'')}<div class="field"><label>&nbsp;</label>${received?badge(purchase?'Đã nhập kho':'Đã xuất hàng'):btn(purchase?'Xác nhận nhập kho':p.kind==='harvest'?'Xác nhận xuất bán':'Xác nhận xuất kho','post-invoice:'+p.id,'primary')}</div></div><div class="note ${received?'success':'warning'} gap">${received?'Đã ghi nhận biến động kho / đàn tương ứng.':'Đơn chưa được '+(purchase?'nhập kho. Xác nhận sau khi đã nhận và kiểm tra function deviceHistoryTable(logs){return table(['Thời gian','Chuồng','Thiết bị','Nguồn','Lệnh','Trạng thái','Người / quy tắc'],logs.map(l=>({cells:[l.time,houseName(l.house),itemDeviceName(l.device),l.kind,l.action,badge(l.status,l.status==='Đã xác nhận'?'':l.status==='Thất bại'?'red':'orange'),esc(l.user)]})),{unit:'lệnh'});}

function reportPage(){
 const hs=visibleHouses(), hf=hs.filter(h=>h.cycle), from=modalContext.fromFilter||'2026-10-01',to=modalContext.toFilter||TODAY;
 const period=arr=>arr.filter(x=>(!x.date||x.date>=from&&x.date<=to)&&(!modalContext.houseFilter||x.house===modalContext.houseFilter));
 const filters=filterBar([['from','Từ ngày',from,'date',null,'data-filter="from"'],['to','Đến ngày',to,'date',null,'data-filter="to"']]);
 let headers=[],rows=[],stats='',note='';
 if(route==='activity'){headers=['Nhóm','Hành động','Nội dung','Nhân viên','Thời gian'];rows=S.activity.map(x=>({cells:[badge(x.group,'gray'),x.action,esc(x.content),esc(x.user),x.time]}));}
 if(route==='report-flocks'){
  headers=['Khu nuôi','Chuồng','Lứa','Ngày tuổi','Tồn đàn','Hao hụt','Trọng lượng TB','Tổng khối lượng','Cám lũy kế'];
  rows=hf.filter(h=>!modalContext.houseFilter||h.id===modalContext.houseFilter).map(h=>({cells:[areaName(h.area),h.name,h.cycle,h.age,num(h.qty),num(h.loss),num(h.weight)+' kg',num(h.qty*h.weight)+' kg',num(h.feed)+' kg']}));
  stats=stat('Tồn đàn',num(sum(hf,'qty'))+' con','barn','#8dbb45')+stat('Hao hụt lũy kế',num(sum(hf,'loss'))+' con','alert','#ef637b')+stat('Khối lượng hiện tại',num(sum(hf,h=>h.qty*h.weight))+' kg','box','#28b2c7')+stat('Cám lũy kế',num(sum(hf,'feed'))+' kg','chart','#f7ab10');
  note='Tồn đàn và số liệu lũy kế tính tại thời điểm hiện tại. Khoảng ngày lọc áp dụng cho các báo cáo phát sinh.';
 }
 if(route==='report-stock'){
  headers=['Mã hàng','Danh mục kho','Tên hàng','Đơn vị','Tồn đầu minh họa','Nhập trong kỳ','Xuất trong kỳ','Tồn hiện tại','Giá trị tồn'];
  rows=S.items.map(i=>{const incoming=sum(period(S.purchases).filter(p=>p.received),p=>sum(p.lines.filter(l=>l.item===i.id),'qty'))+sum(period(S.stockNotes).filter(n=>n.posted&&n.kind==='in'),n=>sum(n.lines.filter(l=>l.item===i.id),'qty'));const outgoing=sum(period(S.sales).filter(p=>p.shipped&&p.kind!=='harvest'),p=>sum(p.lines.filter(l=>l.item===i.id),'qty'))+sum(period(S.stockNotes).filter(n=>n.posted&&n.kind==='out'),n=>sum(n.lines.filter(l=>l.item===i.id),'qty'));return {cells:[i.id,categoryName(i.category),i.name,i.unit,num(i.qty-incoming+outgoing),num(incoming),num(outgoing),num(i.qty),money(i.qty*i.cost)]}});
  note='Tồn hiện tại lấy từ dữ liệu minh họa đã nhập. Nhập / xuất kỳ chỉ bao gồm chứng từ đã xác nhận.';
 }
 if(['report-sales','report-purchases','report-harvest'].includes(route)){
  const purchase=route==='report-purchases',arr=period(purchase?S.purchases:S.sales).filter(p=>route!=='report-harvest'||p.kind==='harvest');
  headers=['Mã đơn','Ngày','Đối tác','Chuồng','Tổng giá trị','Đã thanh toán','Công nợ','Trạng thái kho'];
  rows=arr.map(p=>({cells:[p.id,date(p.date),partyName(p.party),houseName(p.house),money(p.total),money(p.paid),money(Math.max(0,p.total-p.paid)),badge((purchase?p.received:p.shipped)?'Đã xác nhận':'Chờ xác nhận',(purchase?p.received:p.shipped)?'':'orange')]}));
  stats=stat('Số hóa đơn',arr.length,'book','#22b7bd')+stat('Tổng giá trị',money(sum(arr,'total')),'chart','#8cb849')+stat('Đã thanh toán',money(sum(arr,'paid')),'cash','#f9ae15')+stat('Còn công nợ',money(sum(arr,p=>Math.max(0,p.total-p.paid))),'alert','#ef657b');
 }
 if(route==='report-internal'){headers=['Mã phiếu','Ngày','Loại','Nội dung','Số mặt hàng','Giá trị','Trạng thái'];rows=period(S.stockNotes).map(n=>({cells:[n.id,date(n.date),n.kind==='in'?'Nhập':'Xuất',n.reason,n.lines.length,money(sum(n.lines,l=>l.qty*l.price)),badge(n.posted?'Hoàn tất':'Đã thu hồi',n.posted?'':'gray')]}));}
 if(route==='report-finance'){
  const arr=period(S.cash),inc=sum(arr.filter(c=>c.direction==='in'),'amount'),out=sum(arr.filter(c=>c.direction==='out'),'amount');
  stats=stat('Thu trong kỳ',money(inc),'cash','#21b39b')+stat('Chi trong kỳ',money(out),'cash','#ef637b')+stat('Chênh lệch thu / chi',money(inc-out),'chart','#3a90db')+stat('Tồn quỹ hiện tại',money(sum(S.funds,f=>fundBalance(f.id))),'box','#8dbb44');
  headers=['Ngày','Mã phiếu','Loại','Quỹ','Thu','Chi','Đối tượng','Mô tả'];
  rows=arr.map(c=>({cells:[date(c.date),c.id,c.type,S.funds.find(f=>f.id===c.fund)?.name,c.direction==='in'?money(c.amount):'—',c.direction==='out'?money(c.amount):'—',partyName(c.party),esc(c.notes)]}));
  note='Chuyển quỹ có hai phiếu đối ứng, không làm thay đổi tổng tồn quỹ. Thu / chi tiền khác với doanh thu / chi phí lứa.';
 }
 if(route==='report-cycles'){
  headers=['Mã lứa','Chuồng','Trạng thái','Tồn đàn','Chi phí lũy kế','Doanh thu đã giao','Chênh lệch tạm tính','Giá vốn / kg hiện tại'];
  rows=[...hf.map(h=>{const rev=sum(S.sales.filter(p=>p.house===h.id&&p.shipped),'total');return {cells:[h.cycle,h.name,badge('Đang nuôi'),num(h.qty),money(h.cost),money(rev),money(rev-h.cost),h.qty*h.weight?money(h.cost/(h.qty*h.weight)):'—']}}),...S.closedCycles.map(c=>({cells:[c.id,houseName(c.house),badge('Đã kết thúc','gray'),'0',money(c.cost),money(c.revenue),money(c.revenue-c.cost),'—']}))];
  note='Chênh lệch lứa đang nuôi là số tạm tính, chưa phải lợi nhuận cuối kỳ. Chi phí mua vật tư được tính về lứa khi sử dụng hoặc phân bổ.';
 }
 return (stats?'<div class="stats">'+stats+'</div>':'')+panel(ROUTES[route].title,filters+(note?'<div class="note mb">'+note+'</div>':'')+table(headers,rows),exportButton()+btn('In báo cáo','print','','print'));
}

function permissionTable(editable=false){
 const rows=GROUPS.filter(g=>g.id!=='settings'&&g.id!=='dashboard').map(g=>{const roles=ROLE_ALL.map(r=>g.pages.some(p=>p[2].includes(r)));return {cells:[g.label,...roles.map((yes,i)=>editable&&i!==0?'<label class="check"><input type="checkbox" data-permission="'+g.id+':'+ROLE_ALL[i]+'" '+(yes?'checked':'')+' disabled>'+badge(yes?'Theo phân quyền':'Không có',yes?'':'gray')+'</label>':badge(yes?'Có quyền':'Không có',yes?'':'gray'))]}});
 return table(['Nhóm nghiệp vụ','Chủ trang trại','Kế toán','Công nhân'],rows,{all:true,search:false});
}

function pickerRows(q=''){return table(['Mã hàng','Danh mục','Tên hàng','Tồn kho','Đơn giá',''],S.items.filter(i=>(!editor||editor.kind!=='harvest'||i.category==='harvest')&&i.name.toLowerCase().includes(q.toLowerCase())).map(i=>({cells:[i.id,categoryName(i.category),i.name,num(i.qty)+' '+i.unit,money(editor?.kind==='purchase'?i.cost:i.price),btn('Chọn','pick-item:'+i.id,'small primary')]})),{all:true,search:false});}
function nextId(prefix,arr){let n=1;const nums=arr.map(x=>{const m=String(x.id||'').match(new RegExp('^'+prefix+'(\\d+)$'));return m?Number(m[1]):0;});n=Math.max(0,...nums)+1;return prefix+String(n).padStart(prefix.length>=2?4:3,'0');}
function workerWarehouseIds(){return S.warehouseAssignments[employeeId()]||['feed','medicine','vaccine','chemical'];}
function dataOf(form){const d=Object.fromEntries(new FormData(form).entries());form.querySelectorAll('input[type="checkbox"]').forEach(c=>d[c.name]=c.checked);return d;}
function upsert(arr,id,obj,prefix){if(id){const x=arr.find(x=>x.id===id);if(!x)throw Error('Không tìm thấy bản ghi');Object.assign(x,obj);return x;}const x={id:obj.id||nextId(prefix,arr),...obj};if(arr.some(a=>a.id===x.id))throw Error('Mã đã tồn tại');arr.push(x);return x;}
function requireHouse(id,needCycle=true){const h=visibleHouses().find(h=>h.id===id);if(!h)throw Error('Chuồng ngoài phạm vi được giao');if(needCycle&&!h.cycle)throw Error('Chuồng chưa có lứa đang nuôi');return h;}
function taskCompletionIssue(t){
 if(!t||!t.id)return 'Không tìm thấy công việc.';
 if(!canEditFarm())return 'Kế toán chỉ xem và đối soát công việc.';
 if(t.status==='Đã hoàn thành')return 'Công việc đã hoàn thành.';
 const h=visibleHouses().find(h=>h.id===t.house);
 if(!h)return 'Công việc ngoài chuồng được phân công.';
 if(role==='worker'&&t.worker&&t.worker!==employeeId())return 'Công việc được giao cho nhân viên khác.';
 if(!h.cycle||t.cycle&&t.cycle!==h.cycle||t.date&&t.date<h.start)return 'Công việc không thuộc lứa đang nuôi.';
 if(farmJournalLocked(h,TODAY))return 'Nhật ký hôm nay đã chốt. Chủ trang trại cần mở lại trước khi ghi hoàn thành.';
 return '';
}
function completeFarmTask(t,notesText){
 const issue=taskCompletionIssue(t);if(issue)throw Error(issue);
 const h=farmRequireWrite(t.house,TODAY);
 if(S.diaries.some(e=>e.linkedTask===t.id&&!e.canceled))throw Error('Công việc đã có nhật ký hoàn thành.');
 farmJournalTransaction(()=>{
  const e={id:nextId('NKY',S.diaries),kind:'work',house:h.id,cycle:h.cycle,date:TODAY,time:farmTimeNow(),task:t.name,description:t.name,group:'Mặc định',user:employeeId(),notes:notesText||'',posted:true,linkedTask:t.id,taskPreviousStatus:t.status,lines:[],cost:0,updatedAt:new Date().toISOString()};
  S.diaries.unshift(e);t.status='Đã hoàn thành';t.notes=notesText||'';t.cycle=h.cycle;t.completedAt=e.updatedAt;t.completedBy=employeeId();t.completionJournal=e.id;
 });
}
function cashRecord(direction,amount,fund,type,day,party='',reference='',more={}){const f=S.funds.find(f=>f.id===fund&&f.active);if(!f)throw Error('Nguồn quỹ không còn hoạt động');if(!(amount>0)||!Number.isFinite(amount))throw Error('Số tiền phải lớn hơn 0');if(direction==='out'&&fundBalance(fund)<amount)throw Error('Nguồn quỹ không đủ số dư');const c={id:nextId(direction==='out'?'PC':'PT',S.cash),direction,amount,fund,type,date:day||TODAY,party,reference,method:'Tiền mặt',partyType:'Đối tượng khác',business:false,notes:'',...more};S.cash.push(c);return c;}
function paymentOrder(id,amount,fund,day,method,notesText=''){
 const purchase=S.purchases.some(p=>p.id===id),p=(purchase?S.purchases:S.sales).find(p=>p.id===id);if(!p)throw Error('Không tìm thấy hóa đơn');amount=Number(amount);
 if(amount>p.total-p.paid)throw Error('Thanh toán vượt số công nợ còn lại');
 cashRecord(purchase?'out':'in',amount,fund,purchase?'Nhập hàng':'Bán hàng',day,p.party,p.id,{method,partyType:purchase?'Nhà cung cấp':'Khách hàng',notes:notesText||'Thanh toán '+id});
 p.paid+=amount;p.payments.push({amount,fund,date:day,method});log('Sổ quỹ','Thanh toán',id+' · '+money(amount));
}
function updateHouseFlocks(h){const fs=S.flocks.filter(f=>f.house===h.id&&f.qty>0);h.qty=sum(fs,'qty');h.weight=h.qty?sum(fs,f=>f.qty*f.weight)/h.qty:0;}
function packQuantity(i,qty,unit){if(unit===i.unit)return qty;if(unit===i.specUnit)return qty/i.spec;const convert={Kg:1000,G:1,Lít:1000,Ml:1};if(convert[unit]&&convert[i.specUnit]&&((['G','Kg'].includes(unit)&&['G','Kg'].includes(i.specUnit))||(['Ml','Lít'].includes(unit)&&['Ml','Lít'].includes(i.specUnit))))return qty*convert[unit]/(i.spec*convert[i.specUnit]);throw Error('Đơn vị không phù hợp quy cách '+i.spec+' '+i.specUnit+'/'+i.unit);}

 else if(name==='device-threshold'){if(!(Number(d.dangerMin)<=Number(d.safeMin)&&Number(d.safeMin)<Number(d.safeMax)&&Number(d.safeMax)<=Number(d.dangerMax)))throw Error('Khoảng ngưỡng chưa hợp lệ');Object.assign(S.metrics.find(m=>m.id==='temp_air'),{safeMin:Number(d.safeMin),safeMax:Number(d.safeMax),dangerMin:Number(d.dangerMin),dangerMax:Number(d.dangerMax)});if(Number(d.humidityMax)>100)throw Error('Độ ẩm không vượt 100%');S.metrics.find(m=>m.id==='humidity').dangerMax=Number(d.humidityMax);}

function filesOf(name){return [...($('#modal-form input[name="'+name+'"]')?.files||[])].map(f=>f.name);}
function evaluateRule(r){
 if(!r)return {allowed:false,message:'Không tìm thấy quy tắc'};
 const s=S.devices.find(d=>d.id===r.sensor),d=S.devices.find(d=>d.id===r.device);
 if(!r.active)return {allowed:false,message:'Quy tắc đang tạm dừng'};
 if(!s?.online||!d?.online||!s.active||!d.active)return {allowed:false,message:'Cảm biến / thiết bị mất kết nối hoặc ngừng sử dụng'};
 if(d.overrideUntil>Date.now())return {allowed:false,message:'Thiết bị đang được điều khiển thủ công tạm thời'};
 if(d.mode!=='Tự động')return {allowed:false,message:'Thiết bị chưa ở chế độ Tự động'};
 if(d.pending)return {allowed:false,message:'Thiết bị đang chờ xác nhận lệnh trước'};
 const age=Date.now()-Number(s.lastSeen);
 if(!s.lastSeen||!Number.isFinite(age)||age>300000||age < -5000)return {allowed:false,message:'Số đo cảm biến đã cũ. Cập nhật số đo trong Giám sát IoT trước khi đánh giá quy tắc.'};
 const value=r.metric==='Nhiệt độ'?s.temperature:s.humidity;
 if(typeof value!=='number'||!Number.isFinite(value)||r.metric==='Độ ẩm'&&(value<0||value>100))return {allowed:false,message:'Số đo dùng cho quy tắc chưa hợp lệ'};
 if(d.kind==='mist'){
  if(typeof s.humidity!=='number'||!Number.isFinite(s.humidity)||s.humidity<0||s.humidity>100)return {allowed:false,message:'Chưa có số đo độ ẩm hợp lệ để điều khiển phun sương'};
  if(s.humidity>=r.maxHumidity)return d.on?{allowed:true,target:false,immediate:true,message:'Độ ẩm ≥ '+r.maxHumidity+'%. Tắt phun sương, không chờ thời gian duy trì hoặc nghỉ giữa lệnh.'}:{allowed:false,message:'Khóa phun sương do độ ẩm ≥ '+r.maxHumidity+'%'};
 }
 if(r.lastTriggered&&Date.now()-r.lastTriggered<r.cooldown*1000)return {allowed:false,message:'Chưa hết thời gian nghỉ giữa hai lệnh'};
 if(value>=r.threshold)return {allowed:true,target:d.on?null:true,message:d.on?'Đủ điều kiện bật; thiết bị đã bật, không gửi lệnh trùng.':'Đủ điều kiện bật, chờ xác nhận đủ thời gian duy trì.'};
 if(value<=r.offThreshold)return {allowed:true,target:d.on?false:null,message:d.on?'Đủ điều kiện tắt.':'Thiết bị đã tắt; không gửi lệnh trùng.'};
 return {allowed:true,target:null,message:'Số đo trong khoảng giữ trạng thái; không gửi lệnh.'};
}

function sendDeviceCommand(id,on,minutes=15,kind='Thủ công',user=USER_NAMES[role]){
 const d=visibleDevices().find(d=>d.id===id);
 if(!d||!d.online||!d.active||d.kind==='sensor')throw Error('Thiết bị không nhận được lệnh');
 if(d.pending)throw Error('Thiết bị đang chờ xác nhận');
 if(d.on===on){toast(d.name+' đã '+(on?'bật':'tắt')+'.');return;}
 if(minutes)d.overrideUntil=Date.now()+minutes*60000;
 d.pending=true;
 const l={id:nextId('DL',S.deviceLogs),device:id,house:d.house,time:new Date().toLocaleString('vi-VN'),kind,action:(on?'Bật ':'Tắt ')+d.name,status:'Chờ xác nhận',user};
 S.deviceLogs.unshift(l);save();
 setTimeout(()=>{const current=S.devices.find(x=>x.id===id);if(!current)return;current.pending=false;if(current.online&&current.active){current.on=on;current.last=new Date().toLocaleTimeString('vi-VN');l.status='Đã xác nhận';toast('Thiết bị mô phỏng đã '+(on?'bật':'tắt')+': '+current.name);}else{l.status='Thất bại';toast('Thiết bị mất kết nối; lệnh chưa được xác nhận','error');}save();render();},650);
}

function validatePost(p,purchase){
 if(purchase){if(p.received)throw Error('Đơn đã nhập kho');if(p.lines.some(l=>!itemBy(l.item)))throw Error('Đơn chứa hàng hóa không còn tồn tại');return;}
 if(p.shipped)throw Error('Đơn đã xuất hàng');
 if(p.kind==='harvest'){const h=requireHouse(p.house),f=S.flocks.find(f=>f.id===p.flock&&f.house===h.id);const count=sum(p.lines,'count');if(!f||count<1||count>f.qty)throw Error('Tồn đàn không đủ cho đơn thu hoạch');if(p.cycle&&p.cycle!==h.cycle)throw Error('Đơn thuộc lứa khác');}
 else {const totals={};p.lines.forEach(l=>totals[l.item]=(totals[l.item]||0)+l.qty);for(const [id,qty] of Object.entries(totals)){const i=itemBy(id);if(!i||i.qty+.000001<qty)throw Error('Không đủ tồn '+(i?.name||id));}}
}
function postOrder(p,purchase,day=TODAY,worker=employeeId()){
 validatePost(p,purchase);
 if(purchase){for(const l of p.lines){const i=itemBy(l.item);const total=i.qty+l.qty;i.cost=total?(i.qty*i.cost+l.qty*l.price)/total:i.cost;i.qty=total;}p.received=true;p.receivedDate=day;}
 else if(p.kind==='harvest'){const h=requireHouse(p.house),f=S.flocks.find(f=>f.id===p.flock);f.qty-=sum(p.lines,'count');updateHouseFlocks(h);p.shipped=true;p.shippedDate=day;p.cycle=h.cycle;}
 else {p.lines.forEach(l=>itemBy(l.item).qty-=l.qty);p.shipped=true;p.shippedDate=day;}
 p.stockWorker=worker;log('Kho hàng','Xác nhận',p.id+' · '+(purchase?'Nhập kho':p.kind==='harvest'?'Thu hoạch xuất bán':'Xuất kho'));
}

function parseCsv(text){const rows=[],row=[];let value='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++;}else quoted=!quoted;}else if(!quoted&&(c===','||c===';'||c==='\t')){row.push(value);value='';}else if(!quoted&&(c==='\n'||c==='\r')){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);if(row.some(x=>x.trim()))rows.push([...row]);row.length=0;value='';}else value+=c;}row.push(value);if(row.some(x=>x.trim()))rows.push(row);return rows;}

function drawFarmSystemMap(){
 const canvas=$('#farm-map-canvas'),svg=canvas?.querySelector('svg.farm-map-paths');if(!canvas||!svg)return;
 const box=canvas.getBoundingClientRect(),pos=id=>{
  const r=$('#map-node-'+id)?.getBoundingClientRect();
  return r?{left:r.left-box.left,right:r.right-box.left,top:r.top-box.top,bottom:r.bottom-box.top,x:(r.left+r.right)/2-box.left,y:(r.top+r.bottom)/2-box.top}:null;
 };
 svg.setAttribute('viewBox','0 0 '+box.width+' '+box.height);svg.setAttribute('width',box.width);svg.setAttribute('height',box.height);
 const colors={blue:'#2e86c1',orange:'#e67e22',red:'#cb4335',green:'#27ae60'};
 const edges=[
  ...['feed','work','health','environment'].map(id=>[id,'cycles','blue','up']),
  ['goods','feed','orange','up'],['goods','work','orange','up'],
  ['units','goods','orange','same-up'],['brands','goods','orange','same-up'],
  ['purchase','goods','red','up'],['goods','sale','orange','down'],['goods','stock','orange','down'],
  ['cycles','harvest','green','outside'],
  ['purchase','expenses','red','down'],['sale','receipts','red','down'],['harvest','receipts','red','down'],
  ['expenses','funds','red','same-down',20],['receipts','funds','red','same-down',35],['transfers','funds','red','same-down',50]
 ];
 const defs='<defs><marker id="map-reference-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#94a3b8" stroke-width="1.5"/></marker></defs>';
 svg.innerHTML=defs+edges.map(([from,to,color,mode,depth])=>{
  const a=pos(from),b=pos(to);if(!a||!b)return '';let path;
  if(mode==='same-down')path='M '+a.x+' '+a.bottom+' C '+a.x+' '+(a.bottom+depth)+', '+b.x+' '+(b.bottom+depth)+', '+b.x+' '+b.bottom;
  else if(mode==='same-up')path='M '+a.x+' '+a.top+' C '+a.x+' '+(a.top-30)+', '+b.x+' '+(b.top-30)+', '+b.x+' '+b.top;
  else if(mode==='outside'){
   const outside=box.width-102,r=18;
   path='M '+a.right+' '+a.y+' H '+(outside-r)+' Q '+outside+' '+a.y+', '+outside+' '+(a.y+r)+' V '+(b.y-r)+' Q '+outside+' '+b.y+', '+(outside-r)+' '+b.y+' H '+b.right;
  }else if(mode==='up')path='M '+a.x+' '+a.top+' C '+a.x+' '+(a.top-60)+', '+b.x+' '+(b.bottom+60)+', '+b.x+' '+b.bottom;
  else path='M '+a.x+' '+a.bottom+' C '+a.x+' '+(a.bottom+60)+', '+b.x+' '+(b.top-60)+', '+b.x+' '+b.top;
  return '<path data-from="'+from+'" data-to="'+to+'" d="'+path+'" fill="none" stroke="'+colors[color]+'" stroke-width="1.5" stroke-opacity=".8" stroke-dasharray="6 4" marker-end="url(#map-reference-arrow)"/>';
 }).join('');
}

  else if(f.id==='chat-form'){const text=dataOf(f).message.trim();if(!text)return;const houses=visibleHouses(),lower=text.toLowerCase();let answer='Bạn có thể mở Nhật ký để ghi thực tế, hoặc Danh mục màn hình để xem các chức năng trong quyền của mình.';
   if(/đàn|gà|chuồng/.test(lower))answer='Phạm vi '+ROLE_NAMES[role]+': '+houses.map(h=>h.name+' ('+num(h.qty)+' con)').join(', ')+'. Tổng '+num(sum(houses,'qty'))+' con.';
   else if(/cám|kho/.test(lower))answer='Tồn cám: '+S.items.filter(i=>i.category==='feed'&&(role!=='worker'||workerWarehouseIds().includes(i.category))).map(i=>i.name+': '+num(i.qty)+' '+i.unit).join('; ')+'.';
   else if(/việc|lịch/.test(lower))answer='Việc chưa hoàn thành: '+(S.tasks.filter(t=>houses.some(h=>h.id===t.house)&&t.status!=='Đã hoàn thành').map(t=>houseName(t.house)+' · '+t.name+' lúc '+t.time).join('; ')||'Không có')+'.';
   else if(/thiết bị|quạt|đèn|sương|iot/.test(lower))answer=role==='accountant'?'Kế toán xem ước tính điện năng; điều khiển thiết bị thuộc chủ trại và công nhân.':'Thiết bị trong phạm vi: '+visibleDevices().length+'. Mất kết nối: '+(visibleDevices().filter(d=>!d.online).map(d=>d.name).join(', ')||'Không có')+'.';
   else if(/nợ|tiền|quỹ/.test(lower))answer=isFinance()?'Tồn quỹ: '+money(sum(S.funds,f=>fundBalance(f.id)))+'. Phải trả: '+money(sum(S.purchases,p=>p.total-p.paid))+'. Phải thu: '+money(sum(S.sales,p=>p.total-p.paid))+'.':'Vai trò công nhân không có quyền xem sổ quỹ và công nợ.';
   chatMessages.push({text,bot:false},{text:answer,bot:true});render();$('.chat-messages')?.scrollTo(0,99999);
  }
 }catch(err){S=JSON.parse(before);save();modalError(err.message);}
});
document.addEventListener('change',e=>{
 const t=e.target;
 try{
  if(t.id==='role-select'){if(window.FARMSHIFT_LOCKED_ROLE)return;activeEmployee='';role=t.value;resetFarmDiaryUi();columnFilters={};USER_NAMES[role]=S.employees.find(x=>x.id===employeeId())?.name||USER_NAMES[role];closeModal();query='';pageNumber=1;editor=null;modalContext={};chatMessages=[];if(!allowed(route))navigate('dashboard');render();return;}
  if(t.matches('#login-form [name="role"]')){$('#login-form [name="email"]').value=S.employees.find(x=>x.role===t.value)?.email||'';return;}
  if(t.dataset.column!==undefined&&t.tagName==='SELECT'){columnFilters[t.dataset.column]=t.value;pageNumber=1;render();return;}
  if(t.dataset.filter){modalContext[t.dataset.filter+'Filter']=t.value;pageNumber=1;render();return;}
  if(t.dataset.editor){const key=t.dataset.editor;editor[key]=t.type==='checkbox'?t.checked:t.value;if(key==='house'||key==='flock'){if(editor.lines.length){editor.lines=[];toast('Đã đổi đàn nguồn, cần thêm lại hàng thu hoạch');}if(key==='house')editor.flock='';editor.avgWeight=S.flocks.find(f=>f.id===editor.flock)?.weight||0;render();}else updateEditorTotals();return;}
  if(t.id==='line-item'){pickItem(t.value);return;}
  if(t.closest('#line-form')){recalcLine();return;}
  if(t.dataset.deviceSwitch){const d=visibleDevices().find(d=>d.id===t.dataset.deviceSwitch);const desired=t.checked;t.checked=d?.on||false;openModal('device-command',d.id,desired?'on':'off');return;}
  if(t.dataset.deviceMode){const d=visibleDevices().find(d=>d.id===t.dataset.deviceMode),mode=t.value;t.value=d.mode;openModal('device-mode',d.id,mode);return;}
  if(t.dataset.ruleSwitch){if(role!=='owner')throw Error('Không có quyền');const r=S.rules.find(r=>r.id===t.dataset.ruleSwitch);if(t.checked&&S.rules.some(x=>x.id!==r.id&&x.active&&x.device===r.device)){t.checked=false;throw Error('Thiết bị đã có quy tắc hoạt động');}r.active=t.checked;log('IoT','Cập nhật',r.name+' · '+(r.active?'Kích hoạt':'Tạm dừng'));render();return;}
  if(t.id==='import-file'){readImport(t.files[0]).catch(err=>modalError(err.message));return;}
  if(t.matches('#modal-form [data-modal-house]')){
   const h=visibleHouses().find(h=>h.id===t.value),flock=$('#modal-form [data-modal-flock]');
   if(flock)flock.innerHTML=opt(S.flocks.filter(f=>f.house===h?.id&&f.qty>0).map(f=>[f.id,f.name+' · '+num(f.qty)+' con']),S.flocks.find(f=>f.house===h?.id)?.id);
   for(const [fieldName,isSensor] of [['sensor',true],['device',false]]){const f=$('#modal-form [name="'+fieldName+'"]');if(f&&['rule','device-schedule'].includes(modalName))f.innerHTML=opt(visibleDevices().filter(d=>d.house===h?.id&&(isSensor?d.kind==='sensor':d.kind!=='sensor')).map(d=>[d.id,d.name]),'');}
   return;
  }
  if(t.matches('#modal-form [data-diary-item]')){const i=itemBy(t.value);$('#modal-form [name="unit"]').innerHTML=opt([...new Set([i.specUnit,i.unit])],i.specUnit);return;}
  if(t.matches('#modal-form [name="lineItem"]')){$('#f-linePrice').value=itemBy(t.value)?.cost||0;return;}
  if(t.matches('#modal-form [data-payment-order]')){const p=[...S.purchases,...S.sales].find(p=>p.id===t.value);$('#modal-form [name="amount"]').value=Math.max(0,p.total-p.paid);return;}
  if(t.matches('#modal-form [data-party-type]')){const arr={'Nhà cung cấp':S.suppliers,'Khách hàng':S.customers,'Nhân viên':S.employees}[t.value],f=$('#modal-form [name="party"]');if(arr){const s=document.createElement('select');s.name='party';s.id=f.id;s.innerHTML=opt(arr.map(p=>[p.id,p.name]),'');f.replaceWith(s);}else{const i=document.createElement('input');i.name='party';i.id=f.id;f.replaceWith(i);}return;}
 }catch(err){modalError(err.message);}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.editor&&editor){editor[t.dataset.editor]=t.type==='checkbox'?t.checked:t.value;updateEditorTotals();}
 if(t.closest('#line-form'))recalcLine();
 if(t.dataset.search){clearTimeout(searchTimer);const caret=t.selectionStart;searchTimer=setTimeout(()=>{query=t.value;pageNumber=1;render();const f=$('[data-search]');f?.focus();f?.setSelectionRange(caret,caret);},180);}
 if(t.dataset.column!==undefined){clearTimeout(searchTimer);const caret=t.selectionStart;searchTimer=setTimeout(()=>{columnFilters[t.dataset.column]=t.value;pageNumber=1;render();const f=$('[data-column="'+t.dataset.column+'"]');f?.focus();f?.setSelectionRange(caret,caret);},180);}
 if(t.id==='picker-search')$('#picker-list').innerHTML=pickerRows(t.value);
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(modalName){closeModal();render();}$$('.dropdown').forEach(d=>d.classList.add('hidden'));}
 if(e.key==='Tab'&&modalName){const fields=$$('#modal-root button:not([disabled]),#modal-root input:not([disabled]),#modal-root select:not([disabled]),#modal-root textarea:not([disabled]),#modal-root summary').filter(x=>x.offsetParent!==null),first=fields[0],last=fields[fields.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
});
window.addEventListener('hashchange',()=>{query='';columnFilters={};pageNumber=1;closeModal();render();window.scrollTo(0,0);});
S.flocks.forEach(f=>{if(!f.cycle)f.cycle=S.houses.find(h=>h.id===f.house)?.cycle;});
S.diaries.forEach(d=>{if(!d.cycle)d.cycle=S.houses.find(h=>h.id===d.house)?.cycle;});
Object.keys(USER_NAMES).forEach(r=>USER_NAMES[r]=S.employees.find(e=>e.role===r)?.name||USER_NAMES[r]);
render();
function runIotSimulation(time,elapsed,doRules=true,doSchedules=true){
 const notes=[],locked=new Set(),now=Date.now();
 if(doRules)for(const r of S.rules.filter(r=>r.active)){
  const res=evaluateRule(r),d=S.devices.find(d=>d.id===r.device);
  if(!res.allowed){notes.push(r.id+': '+res.message);continue;}
  if(!res.immediate&&elapsed<r.hold){notes.push(r.id+': chưa đủ thời gian duy trì');continue;}
  if(res.target!==null){sendDeviceCommand(r.device,res.target,0,'Tự động','Quy tắc '+r.id);r.lastTriggered=now;locked.add(r.device);}else notes.push(r.id+': giữ trạng thái');
 }
 if(doSchedules){
  const targets=new Map();
  for(const s of S.schedules.filter(s=>s.active)){const d=S.devices.find(d=>d.id===s.device);if(!d?.online||!d.active||d.mode!=='Theo lịch'||d.overrideUntil>now||d.pending||locked.has(d.id)){notes.push(s.id+': bỏ qua do kết nối / chế độ / ưu tiên');continue;}
   const weekday=new Date(TODAY).getDay(),valid=s.days==='Hàng ngày'||s.days==='Thứ 2 – Thứ 6'&&weekday>=1&&weekday<=5||s.days==='Cuối tuần'&&(weekday===0||weekday===6);
   const inside=valid&&(s.on<s.off?time>=s.on&&time<s.off:time>=s.on||time<s.off);
   targets.set(d.id,(targets.get(d.id)||false)||inside);
  }
  for(const [id,on] of targets){const d=S.devices.find(d=>d.id===id);if(d.on!==on)sendDeviceCommand(id,on,0,'Theo lịch','Lịch tại '+time);}
 }
 log('IoT','Mô phỏng','Đánh giá tự động tại '+time+' · Duy trì '+elapsed+'s');return 'Đã kiểm tra quy tắc / lịch. Xem kết quả ở Lịch sử đo & điều khiển.';
}
