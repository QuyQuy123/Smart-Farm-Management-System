services:
  postgres:
    image: postgres:16-alpine
    container_name: farmshift_db_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: farmshift_db
    ports:
      - "5432:5432"
    volumes:
      - farmshift_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  farmshift_pgdata:
