spring.application.name=backendFarmShift
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ─────────────────────────────────────────────────────────────────────────────
# JWT
# jwt.secret must be a Base64-encoded key of at least 256 bits (32 raw bytes).
# Generate one with: openssl rand -base64 32
# ─────────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
# 24 hours in milliseconds (86400000). Reduce for production if needed.
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# ─────────────────────────────────────────────────────────────────────────────
# JavaMailSender — Gmail SMTP (replace with your provider / SES / SendGrid)
# Set MAIL_USERNAME and MAIL_PASSWORD as environment variables or in .env
# For Gmail, use an App Password (https://myaccount.google.com/apppasswords)
# ─────────────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8