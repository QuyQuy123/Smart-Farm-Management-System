spring.application.name=backendFarmShift
storage.provider=${STORAGE_PROVIDER:r2}
storage.local.directory=${STORAGE_LOCAL_DIRECTORY:}
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
# Keep SQL query and parameter tracing quiet; warnings/errors remain available.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.orm.jdbc.extract=WARN
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.profiles.active=local

# ─────────────────────────────────────────────────────────────────────────────
# JWT
# jwt.secret must be a Base64-encoded key of at least 256 bits (32 raw bytes).
# Generate one with: openssl rand -base64 32
# ─────────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
# 24 hours in milliseconds (86400000). Reduce for production if needed.
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# ─────────────────────────────────────────────────────────────────────────────
# Email Delivery Service
# 1. Resend HTTP API (Recommended for Render Free tier — works via HTTPS port 443)
# ─────────────────────────────────────────────────────────────────────────────
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:FarmShift <onboarding@resend.dev>}

# 2. JavaMailSender — SMTP fallback (Render Free tier blocks outbound SMTP ports 25, 465, 587)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# AI Microservice (aiServiceFarmShift: Python FastAPI)
# Toàn bộ AI OCR, Whisper STT, LLM Chat và Vision Models do aiServiceFarmShift đảm nhận.
ai-service.url=${AI_SERVICE_URL:http://localhost:8000}

# ─────────────────────────────────────────────────────────────────────────────
# Cloudflare R2 Storage (S3-compatible)
# These map the env-var keys from application-local.properties to the
# Spring property keys expected by R2Config.java (@Value annotations).
# ─────────────────────────────────────────────────────────────────────────────
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.endpoint-url=${R2_ENDPOINT_URL}
r2.bucket-name=${R2_BUCKET_NAME}
r2.public-url=${R2_PUBLIC_URL}

# Original sales weight slips are stored in frontend public/weigh-slips by default.
sales.weight-slips.directory=${SALES_WEIGHT_SLIPS_DIRECTORY:}

# Starts the local Python AI service with Spring Boot (only local profile, never test).
ai-service.autostart.enabled=${AI_SERVICE_AUTOSTART_ENABLED:true}
ai-service.autostart.directory=${AI_SERVICE_DIRECTORY:}
ai-service.autostart.python=${AI_SERVICE_PYTHON:}
ai-service.autostart.timeout-seconds=${AI_SERVICE_START_TIMEOUT:45}
