spring.application.name=backendFarmShift
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.profiles.active=local

# ─────────────────────────────────────────────────────────────────────────────
# JWT
# jwt.secret must be a Base64-encoded key of at least 256 bits (32 raw bytes).
# Generate one with: openssl rand -base64 32
# ─────────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
# 24 hours in milliseconds (86400000). Reduce for production if needed.
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# ─────────────────────────────────────────────────────────────────────────────
# JavaMailSender — Gmail SMTP (replace with your provider / SES / SendGrid)
# Set MAIL_USERNAME and MAIL_PASSWORD as environment variables or in .env
# For Gmail, use an App Password (https://myaccount.google.com/apppasswords)
# ─────────────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ─────────────────────────────────────────────────────────────────────────────
# Cloudflare R2 Storage (S3-compatible)
# These map the env-var keys from application-local.properties to the
# Spring property keys expected by R2Config.java (@Value annotations).
# ─────────────────────────────────────────────────────────────────────────────
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.endpoint-url=${R2_ENDPOINT_URL}
r2.bucket-name=${R2_BUCKET_NAME}
r2.public-url=${R2_PUBLIC_URL}