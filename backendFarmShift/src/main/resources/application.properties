spring.application.name=backendFarmShift
storage.provider=${STORAGE_PROVIDER:r2}
storage.local.directory=${STORAGE_LOCAL_DIRECTORY:}
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.orm.jdbc.extract=WARN
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.profiles.active=local


jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:FarmShift <onboarding@resend.dev>}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.endpoint-url=${R2_ENDPOINT_URL}
r2.bucket-name=${R2_BUCKET_NAME}
r2.public-url=${R2_PUBLIC_URL}


sales.weight-slips.directory=${SALES_WEIGHT_SLIPS_DIRECTORY:}


ai-service.autostart.enabled=${AI_SERVICE_AUTOSTART_ENABLED:true}
ai-service.autostart.directory=${AI_SERVICE_DIRECTORY:}
ai-service.autostart.python=${AI_SERVICE_PYTHON:}
ai-service.autostart.timeout-seconds=${AI_SERVICE_START_TIMEOUT:45}

# Tomcat resilience against connection/request floods
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=2000
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=15s
server.tomcat.max-keep-alive-requests=100

# HikariCP fail-fast & keepalive tuning for remote PostgreSQL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.validation-timeout=3000

# Global HTTP rate limiting
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

